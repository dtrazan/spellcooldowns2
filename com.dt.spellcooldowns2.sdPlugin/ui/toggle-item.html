<!DOCTYPE html>
<html>

<head lang="en">
    <title>Toggle Item Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <script>
        // Load items data and populate dropdown
        async function loadItems() {
            try {
                const response = await fetch('../items.json');
                const items = await response.json();
                
                const select = document.getElementById('item-select');
                items.forEach(item => {
                    const option = document.createElement('option');
                    option.value = JSON.stringify({ id: item.id, name: item.name, img: item.img });
                    option.textContent = `${item.name} (${item.ability_haste} AH)`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load items:', error);
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', loadItems);
    </script>
</head>

<body>
    <!--
        Learn more about property inspector components at https://sdpi-components.dev/docs/components
    -->
    <sdpi-item label="Selected Item">
        <sdpi-select id="item-select" setting="selectedItem">
            <option value="">Select an item...</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Show Item Name">
        <sdpi-checkbox setting="showName" default="true"></sdpi-checkbox>
    </sdpi-item>
</body>

</html>
