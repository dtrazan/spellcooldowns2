<!DOCTYPE html>
<html>

<head lang="en">
    <title>Increment Legend Stack Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <!--
        Learn more about property inspector components at https://sdpi-components.dev/docs/components
    -->
    <sdpi-item label="Legend Stacks">
        <sdpi-select setting="legendStacks">
            <option value="0">0 Stacks</option>
            <option value="1">1 Stack</option>
            <option value="2">2 Stacks</option>
            <option value="3">3 Stacks</option>
            <option value="4">4 Stacks</option>
            <option value="5">5 Stacks</option>
            <option value="6">6 Stacks</option>
            <option value="7">7 Stacks</option>
            <option value="8">8 Stacks</option>
            <option value="9">9 Stacks</option>
            <option value="10">10 Stacks (Max)</option>
        </sdpi-select>
    </sdpi-item>
</body>

</html>
