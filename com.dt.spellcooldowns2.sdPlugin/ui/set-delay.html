<!DOCTYPE html>
<html>

<head lang="en">
    <title>Set Delay Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <!--
        Learn more about property inspector components at https://sdpi-components.dev/docs/components
    -->
    <sdpi-item label="Delay (ms)">
        <sdpi-textfield
            setting="delayValue"
            type="number"
            pattern="^\d+$"
            placeholder="Enter delay in milliseconds"
            min="0"
            value="0"
            required>
        </sdpi-textfield>
    </sdpi-item>
</body>

</html>
